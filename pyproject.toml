[project]
name = "master-code"
version = "0.1.0"
description = "Factor graph SLAM with JCBB data association"
readme = "README.md"
requires-python = ">=3.11,<3.15"  # GTSAM 4.3 wheels cover CPython 3.11-3.14
dependencies = [
    # Was gtsam-develop: the joint-covariance query on ISAM2 used by
    # slam.py only existed in development builds. It shipped in the
    # stable 4.3 release, so the pre-release is no longer needed.
    "gtsam>=4.3,<5",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "omegaconf>=2.3.0",
    "pip>=26.1.1",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
run_real = "master_code.run_real:main"
run_sim = "master_code.run_sim:main"
plot_run = "master_code.plotter:main"


[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
