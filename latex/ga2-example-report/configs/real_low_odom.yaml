noise:
  sigma_odom_x: 0.1
  sigma_odom_y: 0.1
  sigma_odom_yaw_deg: 0.3
  sigma_range: 0.2
  sigma_bearing_deg: 0.5
  sigma_init_pose_x: 0.1
  sigma_init_pose_y: 0.1
  sigma_init_pose_yaw_deg: 0.1
  sigma_gnss: 1.0
sensor:
  max_range: 50.0
  range_local: 55.0
  bearing_local_deg: 100.0
tentative:
  M: 3
  N: 4
  gate: 0.2
association:
  method: jcbb
  alpha_individual: 0.9999
  alpha_joint: 0.9999
  inject_wrong_at_step: null
backend:
  solver: isam2
  relinearize_threshold: 0.1
  relinearize_skip: 10
  covariance_method: bayes_tree
  robust_kernel: none
  huber_k: 1.345
victoria_park:
  initial_heading_deg: 36.0
logging:
  log_association_diagnostics: true
  association_stride: 20
  association_steps: []
  log_snapshot: false
  snapshot_stride: 200
  snapshot_steps: []
  log_error: false
