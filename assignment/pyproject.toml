[project]
name = "graphslam"
version = "1.0.0"
description = "TTK4250 Group Assignment 2: factor graph SLAM with GTSAM"
readme = "README.md"
# GTSAM 4.3 publishes wheels for CPython 3.11-3.14; the upper bound turns a
# missing wheel into a clear resolver error instead of a failed source build.
requires-python = ">=3.11,<3.15"
dependencies = [
    # 4.3 is the first stable release exposing ISAM2.jointMarginalCovariance,
    # which is what graphslam.factor_graph.query_joint_covariance calls. Older
    # releases need a development build; do not relax this bound.
    # Do not add dependencies beyond this list.
    "gtsam>=4.3,<5",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "omegaconf>=2.3",
    "scipy>=1.11",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
run_sim = "graphslam.run_sim:main"
run_real = "graphslam.run_real:main"
plot_run = "graphslam.plotter:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
