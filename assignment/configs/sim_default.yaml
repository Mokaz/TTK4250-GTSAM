# Baseline tuning for the simulated data set.
# Everything marked "TODO tune" is yours to experiment with in Task 2.
noise:
  sigma_odom_x: 0.01             # TODO tune
  sigma_odom_y: 0.01             # TODO tune
  sigma_odom_yaw_deg: 0.5        # TODO tune
  sigma_range: 0.2               # TODO tune
  sigma_bearing_deg: 2.0         # TODO tune
  sigma_init_pose_x: 0.001       # the run starts exactly at the true pose
  sigma_init_pose_y: 0.001
  sigma_init_pose_yaw_deg: 0.001
sensor:
  # Not tuning values. The local map holds the landmarks offered to data
  # association: the simulated sensor sees 80 m and +-90 deg, and the margin
  # covers pose uncertainty. Set it smaller and landmarks the sensor does see
  # become duplicates.
  max_range: 80.0                # the sensor's reach (the data already stops there)
  range_local: 85.0
  bearing_local_deg: 125.0
tentative:
  M: 2                           # TODO tune: no clutter here, but one missed match must not become a landmark
  N: 3                           # TODO tune
  gate: 0.5                      # TODO tune
association:
  method: jcbb
  alpha_individual: 0.9999       # TODO tune
  alpha_joint: 0.999             # TODO tune
  inject_wrong_at_step: null     # Task 4(b): a scan step, e.g. 600, to force one wrong association there
backend:
  solver: isam2                  # "batch" re-solves the whole graph every step
  relinearize_threshold: 0.1     # TODO tune (Task 4)
  relinearize_skip: 10           # TODO tune (Task 4)
  covariance_method: bayes_tree      # "marginals" to compare
  robust_kernel: none            # "huber" (Task 4)
  huber_k: 1.345
logging:
  log_association_diagnostics: true
  association_stride: 1
  association_steps: []
  log_snapshot: false
  snapshot_stride: 1
  snapshot_steps: []
  log_error: false
