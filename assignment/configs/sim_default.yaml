# Baseline tuning for the simulated data set.
# Everything marked TODO tune is yours to experiment with in Task 2.
noise:
  sigma_odom_x: 0.01             # TODO tune
  sigma_odom_y: 0.01             # TODO tune
  sigma_odom_yaw_deg: 0.5        # TODO tune
  sigma_range: 0.2               # TODO tune
  sigma_bearing_deg: 2.0         # TODO tune
  sigma_init_pose_x: 0.001       # the run starts exactly at the true pose
  sigma_init_pose_y: 0.001
  sigma_init_pose_yaw_deg: 0.001
sensor:                          # sensor limits, not tuning values
  max_range: 80.0                # how far the sensor sees [m]
  range_local: 85.0              # local map offered to association: reach plus a margin
  bearing_local_deg: 125.0
tentative:                       # landmark birth: seen in M of the last N steps
  M: 2                           # TODO tune
  N: 3                           # TODO tune
  gate: 0.5                      # TODO tune: matching distance [m]
association:
  method: jcbb
  alpha_individual: 0.9999       # TODO tune: a confidence; closer to 1 is a looser gate
  alpha_joint: 0.999             # TODO tune: a confidence; closer to 1 is a looser gate
  inject_wrong_at_step: null     # Task 4 sets this in task4.yaml
backend:
  solver: isam2
  relinearize_threshold: 0.1
  relinearize_skip: 10
  covariance_method: bayes_tree
  robust_kernel: none            # or huber (Task 4)
  huber_k: 1.345                 # Huber threshold, in measurement noise standard deviations
logging:
  log_association_diagnostics: true
  association_stride: 1
  association_steps: []
  log_snapshot: false
  snapshot_stride: 1
  snapshot_steps: []
  log_error: false
