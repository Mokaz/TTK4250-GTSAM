# Baseline tuning for the simulated data set.
# Everything marked "TODO tune" is yours to experiment with in Task 2.
noise:
  sigma_velocity: 0.3            # TODO tune (unused on simulated data)
  sigma_steer_deg: 0.5           # TODO tune (unused on simulated data)
  sigma_odom_x: 0.01             # TODO tune
  sigma_odom_y: 0.01             # TODO tune
  sigma_odom_yaw_deg: 1.0        # TODO tune
  sigma_range: 0.2               # TODO tune
  sigma_bearing_deg: 1.0         # TODO tune
  sigma_init_pose_x: 0.1
  sigma_init_pose_y: 0.1
  sigma_init_pose_yaw_deg: 0.1
sensor:
  range_local: 85.0              # TODO tune
  bearing_local_deg: 125.0       # TODO tune
tentative:
  M: 1                           # TODO tune: no clutter here, so confirm immediately
  N: 1                           # TODO tune
  gate: 0.2                      # TODO tune
association:
  method: jcbb                   # "gt" runs with perfect association, for debugging
  alpha_individual: 0.9999       # TODO tune
  alpha_joint: 0.999             # TODO tune
  gt_gate: 2.0
backend:
  solver: isam2                  # "batch" re-solves the whole graph every step
  relinearize_threshold: 0.1     # TODO tune (Task 4)
  relinearize_skip: 10           # TODO tune (Task 4)
  covariance_method: auto
  robust_kernel: none            # "huber" (Task 4)
  huber_k: 1.345
logging:
  log_association_diagnostics: true
  association_stride: 1
  association_steps: []
  log_snapshot: false
  snapshot_stride: 1
  snapshot_steps: []
  log_error: false
