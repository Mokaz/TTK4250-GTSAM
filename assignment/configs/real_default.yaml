# Baseline tuning for the Victoria Park data set.
# Everything marked TODO tune is yours to experiment with in Task 3.
noise:
  sigma_odom_x: 0.3              # TODO tune
  sigma_odom_y: 0.3              # TODO tune
  sigma_odom_yaw_deg: 0.6        # TODO tune
  sigma_range: 0.2               # TODO tune
  sigma_bearing_deg: 0.5         # TODO tune
  sigma_init_pose_x: 0.1
  sigma_init_pose_y: 0.1
  sigma_init_pose_yaw_deg: 0.1
  sigma_gnss: 1.0                # assumed GPS accuracy [m]; only used for the GPS NIS
sensor:                          # sensor limits, not tuning values
  max_range: 50.0                # trees are extracted out to this range [m]
  range_local: 55.0              # local map offered to association: reach plus a margin
  bearing_local_deg: 100.0
tentative:                       # landmark birth: seen in M of the last N steps
  M: 3                           # TODO tune
  N: 4                           # TODO tune
  gate: 0.2                      # TODO tune: matching distance [m]
association:
  method: jcbb
  alpha_individual: 0.9999       # TODO tune: a confidence; closer to 1 is a looser gate
  alpha_joint: 0.9999            # TODO tune: a confidence; closer to 1 is a looser gate
  inject_wrong_at_step: null
backend:
  solver: isam2
  relinearize_threshold: 0.1
  relinearize_skip: 10
  covariance_method: bayes_tree
  robust_kernel: none
  huber_k: 1.345
victoria_park:
  initial_heading_deg: 36.0      # heading of the first pose in the GPS frame; leave it
logging:
  log_association_diagnostics: true  # feeds the landmark NIS plot
  association_stride: 20             # every 20th scan keeps the run small
  association_steps: []
  log_snapshot: false
  snapshot_stride: 200
  snapshot_steps: []
  log_error: false
