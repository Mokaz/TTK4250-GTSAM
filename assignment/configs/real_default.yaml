# Baseline tuning for the Victoria Park data set.
# Everything marked "TODO tune" is yours to experiment with in Task 3.
noise:
  sigma_odom_x: 0.3              # TODO tune
  sigma_odom_y: 0.3              # TODO tune
  sigma_odom_yaw_deg: 0.6        # TODO tune
  sigma_range: 0.2               # TODO tune
  sigma_bearing_deg: 0.5         # TODO tune
  sigma_init_pose_x: 0.1
  sigma_init_pose_y: 0.1
  sigma_init_pose_yaw_deg: 0.1
  sigma_gnss: 1.0                # assumed GNSS accuracy [m]; never fed to the graph, only scales the GNSS NIS plot
sensor:
  # Not tuning values. Trees are extracted from each scan out to max_range. The
  # local map (the landmarks offered to data association) reaches a little
  # further, so a tree near the limit stays in it when the pose estimate is
  # slightly off; the laser sees +-90 deg.
  max_range: 50.0
  range_local: 55.0
  bearing_local_deg: 100.0
tentative:
  M: 3                           # TODO tune: lidar tree detections are noisy
  N: 4                           # TODO tune
  gate: 0.2                      # TODO tune
association:
  method: jcbb
  alpha_individual: 0.9999       # TODO tune
  alpha_joint: 0.9999            # TODO tune
  inject_wrong_at_step: null     # Task 4(b): a scan step, e.g. 600, to force one wrong association there
backend:
  solver: isam2                  # do not use "batch" on this data set
  relinearize_threshold: 0.1     # TODO tune (Task 4)
  relinearize_skip: 10           # TODO tune (Task 4)
  covariance_method: bayes_tree      # "marginals" to compare
  robust_kernel: none            # "huber" (Task 4)
  huber_k: 1.345
victoria_park:
  # Heading of the first pose in the GNSS frame. GNSS gives no heading and SLAM
  # cannot observe it: changing it rotates the whole solution, nothing else.
  initial_heading_deg: 36.0
logging:
  # On: this is what feeds the landmark-NIS plot, which is the only consistency
  # check Victoria Park gives you (there is no ground truth, so no NEES). Every
  # 20th scan keeps the run directory to a couple of megabytes.
  log_association_diagnostics: true
  association_stride: 20
  association_steps: []
  log_snapshot: false
  snapshot_stride: 200
  snapshot_steps: []
  log_error: false
